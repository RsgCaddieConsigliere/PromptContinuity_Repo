[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-reconcile"
version = "0.1.2"
description = "Deterministic corpus reconciliation engine for fixity, dedupe, lineage, and gated transaction planning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
corpus-reconcile = "corpus_reconcile.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["corpus_reconcile*"]
